[versions]
aboutlibVersion = "15.2.0"
cascadeComposeVersion = "2.3.0"
coilVersion = "3.6.3"
injektCoreVersion = "1.16.1"
kotlinResultVersion = "2.3.1"
detektVersion = "1.23.8"
ktfmtVersion = "0.27.0"
okhttpVersion = "5.5.0"
retrofitVersion = "3.0.0"
sandwichVersion = "2.4.0"
sqliteVersion = "2.7.1"
kspVersion = "2.3.12"
telephotoVersion = "0.19.0"

[libraries]
telephoto-zoomable = { module = "me.saket.telephoto:zoomable", version.ref = "telephotoVersion" }
telephoto-zoomable-image-coil = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "telephotoVersion" }
cascade-compose = { module = "me.saket.cascade:cascade-compose", version.ref = "cascadeComposeVersion" }
injekt-core = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injektCoreVersion" }
material = "com.google.android.material:material:1.14.0"
desugaring = "com.android.tools:desugar_jdk_libs:2.1.5"
#needed for token bucket to work
guava-fix = "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"

coil3 = { module = "io.coil-kt.coil3:coil", version.ref = "coilVersion" }
coil3-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coilVersion" }
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilVersion" }

coil3-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilVersion" }

disklrue = "com.jakewharton:disklrucache:2.0.2"

jsoup = "org.jsoup:jsoup:1.23.2"

kotlin-result = { module = "com.michael-bull.kotlin-result:kotlin-result", version.ref = "kotlinResultVersion" }
kotlin-result-coroutines = { module = "com.michael-bull.kotlin-result:kotlin-result-coroutines", version.ref = "kotlinResultVersion" }

sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqliteVersion" }
tachi-unifile = "com.github.tachiyomiorg:unifile:a9de196cc7"



okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpVersion" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpVersion" }
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttpVersion" }

okio = "com.squareup.okio:okio:3.18.2"

sandwich = { module = "com.github.skydoves:sandwich", version.ref = "sandwichVersion" }
sandwich-retrofit = { module = "com.github.skydoves:sandwich-retrofit", version.ref = "sandwichVersion" }
sandwich-retrofit-serialization = { module = "com.github.skydoves:sandwich-retrofit-serialization", version.ref = "sandwichVersion" }


timber = "com.jakewharton.timber:timber:5.0.1"

aboutLibraries-compose = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibVersion" }

leakcanary = "com.squareup.leakcanary:leakcanary-android:2.14"
pastelplaceholders = "com.github.zedlabs:pastelPlaceholders:1.0.4"
tokenbucket = "org.isomorphism:token-bucket:1.7"

retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofitVersion" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofitVersion" }
retrofit-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "retrofitVersion" }

#test libs
junit = "junit:junit:4.13.2"
mockk = "io.mockk:mockk:1.14.11"
kotest-assertions = "io.kotest:kotest-assertions-core-jvm:6.2.5"

[plugins]
about-libraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibVersion" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmtVersion" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detektVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }

[bundles]
coil = [ "coil3", "coil3-compose", "coil3-gif", "coil3-okhttp" ]
google = ["material", "guava-fix"]
ok = ["okhttp", "okhttp-logging-interceptor", "okhttp-dnsoverhttps", "okio"]
sandwich = ["sandwich", "sandwich-retrofit", "sandwich-retrofit-serialization"]
tests = ["junit", "mockk", "kotest-assertions"]
retrofit = ["retrofit-core", "retrofit-serialization", "retrofit-scalars"]
results = ["kotlin-result", "kotlin-result-coroutines"]
